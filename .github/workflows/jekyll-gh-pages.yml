# BrainSAIT: publishes only the redirect to the B.I.Lab landing (https://fadil369.github.io/bilab/).
# Used when Pages "Source" is set to GitHub Actions; with "Deploy from a branch" the root
# index.html / 404.html / .nojekyll do the same job without this workflow.
name: Deploy B.I.Lab redirect to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["index.html", "404.html", ".github/workflows/jekyll-gh-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage redirect files only
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
